<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أضف عرض متجرك مجاناً | رادار صفقات غزة ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #060d18;
            background-image:
                radial-gradient(at 15% 5%, rgba(16, 185, 129, 0.14) 0px, transparent 45%),
                radial-gradient(at 85% 15%, rgba(245, 158, 11, 0.08) 0px, transparent 45%);
        }
    </style>
</head>
<body class="text-slate-100 min-h-screen pb-16">
    <header class="bg-slate-900/85 backdrop-blur-lg border-b border-slate-800 sticky top-0 z-40">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <a href="/gaza" class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-amber-400 flex items-center justify-center text-slate-950 shadow-lg">
                    <i class="fa-solid fa-bolt text-xl"></i>
                </div>
                <div>
                    <h1 class="text-base font-black text-white">رادار صفقات غزة</h1>
                    <p class="text-[11px] text-amber-400 font-bold">بوابة التجار والمحلات</p>
                </div>
            </a>
            <a href="/gaza" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 transition">
                <i class="fa-solid fa-arrow-right ml-1"></i> العودة للعروض
            </a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 pt-8">
        <div class="bg-slate-900/90 border border-emerald-500/30 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
            <div class="space-y-2">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-500/15 border border-amber-400/30 text-amber-300 text-xs font-extrabold">
                    <i class="fa-solid fa-store"></i>
                    انشر عروضك مجاناً لآلاف المتسوقين في غزة
                </span>
                <h2 class="text-2xl font-black text-white">أضف عرض متجرك اليوم ⚡</h2>
                <p class="text-sm text-slate-300">
                    أدخل تفاصيل السلعة والسعر المخفّض، وسيتم مراجعتها ونشرها في دليل الأسعار الحي وعلى بوت وقناة تليجرام وصفحة فيسبوك مجاناً.
                </p>
            </div>

            <form id="submit-form" onsubmit="submitMerchantDeal(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم المتجر / السوبرماركت *</label>
                        <input id="store_name" required type="text" placeholder="مثال: سوبرماركت البركة"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">المنطقة / المحافظة *</label>
                        <select id="city_area" required
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                            <option value="مدينة غزة والشمال">مدينة غزة والشمال</option>
                            <option value="دير البلح">دير البلح</option>
                            <option value="المحافظة الوسطى">المحافظة الوسطى (النصيرات والزوايدة)</option>
                            <option value="خانيونس">خانيونس</option>
                            <option value="رفح والمواصي">رفح والمواصي</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">رقم الهاتف أو الواتساب للتواصل مع الزبائن</label>
                    <input id="phone" type="text" placeholder="مثال: 0599000000"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div class="sm:col-span-2">
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم السلعة والكمية *</label>
                        <input id="product_name" required type="text" placeholder="مثال: زيت ذرة عافية 3 لتر"
                            class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1.5">السعر *</label>
                            <input id="price" required type="number" step="0.1" min="0.5" placeholder="25"
                                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-300 mb-1.5">العملة</label>
                            <select id="currency"
                                class="w-full bg-slate-950 border border-slate-700 rounded-xl px-2 py-3 text-sm text-white focus:outline-none focus:border-emerald-500">
                                <option value="ILS">شيكل</option>
                                <option value="USD">دولار $</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">العنوان التفصيلي أو ملاحظات العرض</label>
                    <textarea id="notes" rows="2" placeholder="مثال: بجوار مفترق السرايا - العرض ساري حتى نفاد الكمية"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500"></textarea>
                </div>

                <button id="submit-btn" type="submit"
                    class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-black text-sm shadow-lg shadow-emerald-600/25 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>إرسال العرض للمراجعة والنشر مجاناً</span>
                </button>
            </form>

            <div id="submit-status" class="hidden rounded-2xl p-4 text-sm font-bold"></div>
        </div>
    </main>

    <script>
        async function submitMerchantDeal(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const box = document.getElementById('submit-status');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الإرسال...';
            box.className = 'hidden';

            try {
                const res = await fetch('/api/public/submit_deal', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        store_name: document.getElementById('store_name').value.trim(),
                        city_area: document.getElementById('city_area').value,
                        phone: document.getElementById('phone').value.trim(),
                        product_name: document.getElementById('product_name').value.trim(),
                        price: parseFloat(document.getElementById('price').value),
                        currency: document.getElementById('currency').value,
                        notes: document.getElementById('notes').value.trim(),
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'تعذر إرسال العرض');
                box.className = 'rounded-2xl p-4 text-sm font-bold bg-emerald-500/15 border border-emerald-500/40 text-emerald-300';
                box.textContent = data.message || 'تم استلام عرضك بنجاح! ستتم مراجعته ونشره قريباً.';
                document.getElementById('submit-form').reset();
            } catch (err) {
                box.className = 'rounded-2xl p-4 text-sm font-bold bg-rose-500/15 border border-rose-500/40 text-rose-300';
                box.textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i><span>إرسال العرض للمراجعة والنشر مجاناً</span>';
            }
        }
    </script>
</body>
</html>
